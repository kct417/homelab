http:
  routers:
    traefik:
      rule: "Host(`traefik.internal`)"
      entryPoints:
        - web
      service: api@internal
      middlewares:
        - traefik-auth

    traefik-metrics:
      rule: "Host(`metrics.traefik.internal`)"
      service: prometheus@internal
      entryPoints:
        - web
      middlewares:
        - traefik-auth
        - traefik-metrics

  middlewares:
    traefik-auth:
      basicAuth:
        users:
          - '{{ env "TRAEFIK_USERNAME" }}:{{ env "TRAEFIK_PASSWORD_HASH" }}'

    traefik-metrics:
      replacePath:
        path: "/metrics"
