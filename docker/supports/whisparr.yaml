services:
  whisparr:
    image: ghcr.io/hotio/whisparr
    container_name: whisparr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${PWD}/state/whisparr:/config
      - ${PWD}/media:/media #optional
      # - /path/to/downloads:/downloads #optional
    # ports:
      # - 127.0.0.1:6969:6969
    restart: unless-stopped
