services:
  sabnzbd:
    image: linuxserver/sabnzbd
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${PWD}/state/sabnzbd:/config
      - ${PWD}/media/downloads/incomplete:/incomplete-downloads #optional
      - ${PWD}/media/downloads:/downloads #optional
    # ports:
      # - 127.0.0.1:8080:8080
    restart: unless-stopped
