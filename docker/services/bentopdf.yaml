services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple
    container_name: bentopdf
    # ports:
      # - '127.0.0.1:3000:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 3
