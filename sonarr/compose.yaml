services:
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - ./data:/data
#      - /path/to/tvseries:/tv #optional
#      - /path/to/downloadclient-downloads:/downloads #optional
    ports:
      - 127.0.0.1:8989:8989
    restart: unless-stopped
