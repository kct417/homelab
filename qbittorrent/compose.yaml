services:
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config:/config
#      - /path/to/downloads:/downloads #optional
    ports:
      - 127.0.0.1:8080:8080
#      - 6881:6881
#      - 6881:6881/udp
    stop_grace_period: "10s" #optional
    restart: unless-stopped
