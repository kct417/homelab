# docker-compose.yml
services:
  traefik:
    image: traefik
    container_name: traefik
    env_file: ${PWD}/env/traefik.env
    # command:
      # - "--api.insecure=true"
      # - "--providers.docker=true"
      # - "--entrypoints.web.address=:80"
    # ports:
      # - "80:80"
      # - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/scripts/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ${PWD}/scripts/traefik/dynamic:/etc/traefik/dynamic:ro
